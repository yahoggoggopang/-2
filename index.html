  font-weight: 700;

  line-height: 1.25;
}

.subtitle {

.walwal {

  max-width: 280px;

/* 버튼 */
button {
  border: 0;
  width: 100%;
  padding: 17px 20px;
  border-radius: 18px;
  background: #428bd4;
  color: white;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 6px 0 #2469ad;
}

button:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #2469ad;
}

.guide {
  margin-top: 18px;
  font-size: 12px;
  color: #6e8ba7;
}

/* 결과 화면 */
#resultPage {
  display: none;
}

.ticket {
  background: rgba(255,255,255,0.94);
  border: 3px solid #428bd4;
  border-radius: 25px;
  padding: 27px 20px 24px;
  margin-top: 20px;
  box-shadow: 0 8px 0 rgba(53,120,187,0.15);
}

.ticket-top {
  display: flex;
  justify-content: space-between;
  color: #428bd4;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
}

.fortune-name {
  font-size: 29px;
  margin: 20px 0 0;
}

.result-img {
  width: 65%;
  max-width: 230px;
  margin: 15px auto;
}

.score {
  font-size: 19px;
  font-weight: 800;
  color: #3478bd;
}

.message {
  font-size: 15px;
  line-height: 1.8;
  margin: 18px 5px;
}

.info {
  border-top: 1px dashed #8db7df;
  border-bottom: 1px dashed #8db7df;
  margin: 22px 0;
  padding: 17px 0;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
}

.info div {
  padding: 0 5px;
}

.info strong {
  display: block;
  font-size: 10px;
  color: #3478bd;
  margin-bottom: 7px;
}

.info span {
  font-size: 13px;
  font-weight: 700;
}

.retry {
  margin-top: 20px;
}

/* 시크릿 레어는 일반 목록과 따로 둠 */
const secretFortune = {
  number: "12",
  name: "시크릿 레어 행운 왈왈이",
  keyword: "걸어다니는 행운",
  item: "네잎클로버",
  action: "오늘의 순간을 믿기",
  image: "walwal.png",
  secret: true
};


/* 운세 뽑기 시작 */
function startFortune() {

  document.getElementById("startPage").style.display = "none";
  document.getElementById("resultPage").style.display = "none";

  const loading =
    document.getElementById("loadingPage");

  loading.style.display = "flex";


  /*
    2.2초 동안
    '왈왈이가 오늘의 운세를 고르는 중...'
    화면 보여주기
  */

  setTimeout(() => {

    let selected;


    /*
      시크릿 레어 확률 = 2%

      Math.random()은
      0 ~ 1 사이 숫자를 랜덤 생성함.
    */

    const secretChance = Math.random();


    if (secretChance < 0.02) {

      selected = secretFortune;

    } else {

      const randomIndex =
        Math.floor(
          Math.random() * normalFortunes.length
        );

      selected =
        normalFortunes[randomIndex];

    }


    showFortune(selected);

  }, 2200);

}


/* 결과 보여주기 */
function showFortune(fortune) {

  document.getElementById("loadingPage").style.display =
    "none";

  document.getElementById("resultPage").style.display =
    "block";


  document.getElementById("fortuneNumber").innerText =
    "NO." + fortune.number;

  document.getElementById("fortuneName").innerText =
    fortune.name;

  document.getElementById("fortuneKeyword").innerText =
    fortune.keyword;

  document.getElementById("fortuneItem").innerText =
    fortune.item;

  document.getElementById("fortuneAction").innerText =
    fortune.action;

  document.getElementById("fortuneImage").src =
    fortune.image;


  /* 시크릿 레어 디자인 */
  const ticket =
    document.getElementById("ticket");

  if (fortune.secret) {

    ticket.classList.add("secret");

  } else {

    ticket.classList.remove("secret");

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

</script>
